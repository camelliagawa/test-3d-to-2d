<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STL → 半立体（レリーフ）変換</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>STL → 半立体（レリーフ）</h1>
        <div id="steps">
          <span class="step" data-step="1">① 表示</span>
          <span class="step" data-step="2">② 角度決定</span>
          <span class="step" data-step="3">③ プレビュー</span>
          <span class="step" data-step="4">④ 出力</span>
        </div>
      </header>

      <main>
        <div id="viewport">
          <div id="dropzone">
            <div class="dz-inner">
              <p class="dz-title">STLファイルをここにドラッグ&ドロップ</p>
              <p class="dz-sub">またはクリックして選択</p>
              <input type="file" id="fileInput" accept=".stl" hidden />
            </div>
          </div>
        </div>

        <aside id="panel">
          <section class="card">
            <h2>② 角度を決める</h2>
            <p class="hint">マウスでモデルを回転し、レリーフの「正面」にしたい向きにします。</p>
            <div class="btn-row">
              <button class="preset" data-view="front">正面</button>
              <button class="preset" data-view="top">上</button>
              <button class="preset" data-view="side">横</button>
            </div>
            <button id="captureBtn" class="primary" disabled>この角度でプレビュー生成</button>
          </section>

          <section class="card">
            <h2>③ レリーフ設定</h2>
            <label>表示
              <select id="displayMode">
                <option value="relief">レリーフ</option>
                <option value="original">元モデル</option>
              </select>
            </label>
            <label>外形
              <select id="shapeMode">
                <option value="silhouette">輪郭クリップ（形に沿う）</option>
                <option value="plate">長方形プレート</option>
              </select>
            </label>
            <label>出力幅 (mm): <span id="planeWVal">60</span>
              <input type="range" id="planeW" min="10" max="200" step="1" value="60" />
            </label>
            <label>レリーフ深さ (mm): <span id="reliefDVal">8</span>
              <input type="range" id="reliefD" min="1" max="40" step="0.5" value="8" />
            </label>
            <label>ベース厚み (mm): <span id="baseTVal">2</span>
              <input type="range" id="baseT" min="0.5" max="20" step="0.5" value="2" />
            </label>
            <label>解像度: <span id="resVal">320</span>
              <input type="range" id="res" min="80" max="600" step="20" value="320" />
            </label>
            <label>深度の強調 (γ): <span id="gammaVal">1.0</span>
              <input type="range" id="gamma" min="0.3" max="3" step="0.1" value="1.0" />
            </label>
          </section>

          <section class="card">
            <h2>④ 出力</h2>
            <button id="exportBtn" class="primary" disabled>STLで書き出し</button>
            <p id="status" class="status"></p>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
